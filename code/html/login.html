<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpotVia</title>

    <link rel="stylesheet" href="../css/styles_login.css">

</head>

<body>

    <main>

        <a href="index.html" class="btn-back"><ion-icon name="arrow-back-outline"></ion-icon></a>

        <div id="form" class="container">

            <div class="container-form">

                <form action="#" method="post" class="sign-in">
                    <h2> Iniciar Sesión</h2>

                    <div class = "social-networks"> <!--de momento no se usa--> </div>

                    <span> Use su correo y contraseña y identificacion</span>

                    <div class="container-input">
                        <ion-icon name="man-outline"></ion-icon>
                        <input type="text" class= "value-sign-in" pattern="[0-9]*" placeholder="identificacion" required>

                    </div>

                    <div class = "container-input">

                        <ion-icon name="mail-outline"></ion-icon>

                        <input type="email" class= "value-sign-in" placeholder="Ingrese su correo" required>

                    </div>


                    <div class="container-input">

                        <ion-icon name="lock-closed-outline"></ion-icon>

                        <input type="password" class= "value-sign-in" placeholder="Ingrese su contraseña" required>

                    </div>

                    <a href="#">¿olvidaste tu contraseña?</a>

                    <button type="submit" class="button" id="btn-sign-in-from">INICIAR SESIÓN</button>

                </form>

            </div>

            <div class="container-form">

                <form action="#" method="post" class="sign-up">
                
                    <h2>Registrarse</h2>
                    <div class = "social-networks"> <!--de momento no se usa--> </div>
                    <span> Use su correo electronico para registrarse</span>

                    <div class = "container-input">
                        <ion-icon name="person-outline"></ion-icon>
                        <input type="text" class= "value-sign-up" placeholder="nombre" required>
                    </div>

                    <div class = "container-input">
                        <ion-icon name="man-outline"></ion-icon>
                        <input type="text" class= "value-sign-up" pattern="[0-9]*" placeholder="identificacion" required>
                    </div>

                    <div class = "container-input">
                        <ion-icon name="mail-outline"></ion-icon>
                        <input type="email"class= "value-sign-up" placeholder="Ingrese su correo" required>
                    </div>

                    <div class = "container-input">
                        <ion-icon name="lock-closed-outline"></ion-icon>
                        <input type="password" class= "value-sign-up" placeholder="Ingrese su contraseña" required>
                    </div>

                    <button type="submit" class="button" id="btn-sign-up-from">REGISTRARSE</button>

                </form>

            </div>

            <div class="container-welcome">

                <div class="welcome-sign-up welcome">

                    <h3>Bienvenido!</h3>

                    <p>ingrese sus datos personales para usar las funciones del sitio </p>

                    <button type="button" class="button" id="btn-sign-up">registrarse</button>

                </div>

                <div class="welcome-sign-in welcome">

                    <h3>Hola!</h3>

                    <p>ingrese sus datos personales para usar las funciones de nuestro sitio</p>

                    <button type="button" class="button" id="btn-sign-in">iniciar sesión</button>

                </div>

            </div>

        </div>

    </main>





    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>

    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

    <!-- se uso ionicons, para los logos -->

    <script src="../js/login.js"></script>

    <script src="../js/form.js"></script>

</body>

</html>
